<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
<title>UVS Combat Calc - Enhanced</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Barlow:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-root" id="app">

<div class="top-bar">
  <div class="top-title">UVS Combat Calc</div>
  <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙</button>
</div>
 <div class="turn-banner" id="turnBanner">Player 1 Attacks</div>

  
  <!-- HP TRACKERS -->
  <div class="players-row">
    <div class="player-panel">
      <div class="player-label">Player 1</div>
      <div class="hp-display" id="p1hp">30</div>
      <div class="hp-buttons">
        <button class="hp-btn" onclick="changeHP(1,-1)">−</button>
        <button class="hp-btn plus" onclick="changeHP(1,+1)">+</button>
      </div>
    </div>

    <div class="center-col">
      <button class="center-btn" onclick="nextTurn()" title="End Turn" aria-label="End Turn">⇄</button>
      <button class="center-btn" onclick="resetGame()" title="Reset Game" aria-label="Reset Game" style="font-size:14px;">↺</button>
    </div>

    <div class="player-panel">
      <div class="player-label">Player 2</div>
      <div class="hp-display" id="p2hp">30</div>
      <div class="hp-buttons">
        <button class="hp-btn" onclick="changeHP(2,-1)">−</button>
        <button class="hp-btn plus" onclick="changeHP(2,+1)">+</button>
      </div>
    </div>
  </div>

  <!-- CARD POOL & SANITY CHECK -->
  <div class="sanity-section">
    <div class="card-pool-group">
  <div class="field-label">Cards in Pool</div>
  <div class="number-control-vertical">
    <input type="number" id="cardPool" value="0" min="0" max="10" onchange="updateSanityCheck()">
    <div class="vertical-buttons">
      <button class="num-btn-vertical" onclick="adjustCardPool(1)">+</button>
      <button class="num-btn-vertical" onclick="adjustCardPool(-1)">−</button>
    </div>
  </div>
</div>
    <div class="sanity-card" id="sanityCard">
      <div class="sanity-label">CHECK REQUIRED</div>
      <div class="sanity-value" id="sanityValue">0+</div>
    </div>
  </div>

  <!-- ATTACK & DEFENSE -->
  <div class="combat-section">
    <div class="panel">
      <div class="panel-title">Attack</div>
      <div class="field-group">
        <div class="field-label">Zone</div>
        <div class="zone-cycle-container">
          <button class="zone-cycle-btn" id="attackCycleBtn">
            <div class="attack-icon" id="attackIcon">
              <svg class="attack-svg" viewBox="0 0 100 100">
                <!-- Sword blade -->
                <polygon class="sword-blade" points="50,10 45,45 50,50 55,45" fill="#555"/>
                <!-- Sword hilt -->
                <rect class="sword-hilt" x="47" y="50" width="6" height="20" fill="#555"/>
                <!-- Sword guard -->
                <rect class="sword-guard" x="40" y="48" width="20" height="4" fill="#555"/>
                <!-- Sword gem -->
                <circle class="sword-gem" cx="50" cy="55" r="3" fill="#555"/>
              </svg>
            </div>
            <span class="zone-label-text" id="attackZoneText">HIGH</span>
          </button>
          <input type="hidden" id="attackZone" value="High">
        </div>
      </div>
<div class="field-group" style="margin-top:8px;">
  <div class="field-label">Speed</div>
  <div class="number-control-vertical">
    <input type="number" id="speed" value="4" min="0" onchange="updateSanityCheck()">
    <div class="vertical-buttons">
      <button class="num-btn-vertical" onclick="adjustSpeed(1)">+</button>
      <button class="num-btn-vertical" onclick="adjustSpeed(-1)">−</button>
    </div>
  </div>
</div>
<div class="field-group" style="margin-top:8px;">
  <div class="field-label">Damage</div>
  <div class="number-control-vertical">
    <input type="number" id="damage" value="4" min="0">
    <div class="vertical-buttons">
      <button class="num-btn-vertical" onclick="adjustDamage(1)">+</button>
      <button class="num-btn-vertical" onclick="adjustDamage(-1)">−</button>
    </div>
  </div>
</div>
      <div class="throw-row">
        <input type="checkbox" id="throw" onchange="updateSanityCheck()">
        <label for="throw">💫 Throw (Attacking Side)</label>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Defense</div>
      <div class="field-group">
        <div class="field-label">Block Zone</div>
        <div class="zone-cycle-container">
          <button class="zone-cycle-btn" id="blockCycleBtn">
            <div class="shield-icon" id="shieldIcon">
              <svg class="shield-svg" viewBox="0 0 100 100">
                <!-- Shield base outline -->
                <path class="shield-base" d="M50,5 L50,5 C50,5 15,15 15,35 C15,65 50,95 50,95 C50,95 85,65 85,35 C85,15 50,5 50,5 Z" fill="none" stroke="#555" stroke-width="3"/>
                <!-- Top segment (High block) -->
                <path class="shield-segment shield-high" d="M50,10 L50,35 L50,35 L22,30 C22,22 50,10 50,10 Z" fill="#555" opacity="0.3"/>
                <!-- Mid segment -->
                <path class="shield-segment shield-mid" d="M50,38 L50,60 L50,60 L20,50 C20,40 50,38 50,38 Z" fill="#555" opacity="0.3"/>
                <!-- Bottom segment (Low block) -->
                <path class="shield-segment shield-low" d="M50,65 L50,88 L50,88 C50,88 25,75 25,65 C25,60 30,55 30,55 L50,65 Z" fill="#555" opacity="0.3"/>
              </svg>
            </div>
            <span class="zone-label-text" id="blockZoneText">HIGH</span>
          </button>
          <input type="hidden" id="blockZone" value="High">
        </div>
      </div>
<div class="field-group" style="margin-top:8px;">
  <div class="field-label">Block Mod</div>
  <div class="number-control-vertical">
    <input type="number" id="blockMod" value="0" onchange="updateSanityCheck()">
    <div class="vertical-buttons">
      <button class="num-btn-vertical" onclick="adjustBlockMod(1)">+</button>
      <button class="num-btn-vertical" onclick="adjustBlockMod(-1)">−</button>
    </div>
  </div>
</div>
      <div class="no-block-row">
        <input type="checkbox" id="noBlock" onchange="updateSanityCheck()">
        <label for="noBlock">🚫 No Block</label>
      </div>
    </div>
  </div>

  <!-- RESULT -->
  <div class="result-panel" id="result">
    <span class="result-placeholder">— Set attack & defense, then press HIT —</span>
  </div>

  <!-- SINGLE ACTION BUTTON -->
  <div class="action-bar">
    <button class="action-btn btn-hit-main" onclick="resolveHit()">⚡ HIT ⚡</button>
  </div>

  <!-- UTILITIES -->
  <div class="util-row">
    <button class="util-btn" onclick="rollDice()">🎲 Roll Dice</button>
    <div class="dice-result" id="diceResult">—</div>
  </div>

  <!-- WIN OVERLAY -->
  <div id="winOverlay" class="win-overlay" style="display:none;">
    <div class="win-text" id="winText">Player 1 Wins!</div>
    <div class="win-sub">Game Over</div>
    <button class="win-btn" onclick="resetGame()">Play Again</button>
  </div>

</div>

<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js');
  }
</script>
</body>
</html>
